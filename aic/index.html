<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LoadCalcPro X | AIC Calculator</title>
<style>
:root{--navy:#071b47;--teal:#0f766e;--teal2:#115e59}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.shell{height:100%;display:flex;flex-direction:column}
.app-header{flex:0 0 auto;padding:16px 30px 18px;background:var(--navy);color:#fff;box-shadow:0 10px 24px rgba(15,23,42,.18)}
.header-top{display:flex;align-items:flex-start;gap:28px;min-width:0}
.brand{flex:0 0 auto;margin-top:2px;color:#fff;font-size:25px;line-height:1;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.brand .bolt,.brand .x{color:#5eead4}.brand .bolt{margin-right:5px}.brand .x{margin-left:2px}
.title-block{min-width:0}.title{margin:0;font-size:22px;line-height:1.15;font-weight:900;white-space:nowrap}.version{margin-top:5px;color:#dbeafe;font-size:12px;line-height:1.2;font-weight:700}
.actions{display:flex;align-items:stretch;gap:10px;width:100%;margin-top:16px}
.actions button{flex:1 1 0;min-width:0;min-height:44px;border:1px solid rgba(255,255,255,.42);border-radius:9px;background:rgba(255,255,255,.10);color:#fff;font-size:13px;line-height:1.15;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;cursor:pointer;white-space:nowrap}
.actions button:hover{background:rgba(255,255,255,.18)}
.actions .primary{background:var(--teal);border-color:#2dd4bf}.actions .primary:hover{background:var(--teal2)}
.frame-wrap{flex:1 1 auto;min-height:0;background:#f3f4f6}
#aicFrame{display:block;width:100%;height:100%;border:0;background:#f3f4f6}
@media(max-width:700px){.app-header{padding:14px 14px 16px}.header-top{display:block}.brand{font-size:20px}.title{margin-top:8px;font-size:18px;white-space:normal}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{min-height:46px}}
</style>
</head>
<body>
<div class="shell">
  <header class="app-header">
    <div class="header-top">
      <div class="brand"><span class="bolt">⚡</span>LoadCalcPro<span class="x"> X</span></div>
      <div class="title-block">
        <div class="title">Available Fault Current (AIC)</div>
        <div class="version">Version 1.0</div>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="mainSiteBtn">Main Site</button>
      <button type="button" id="calculatorsBtn">Calculators</button>
      <button type="button" class="primary" id="printBtn">Print / PDF</button>
      <button type="button" id="newCalculationBtn">New Calculation</button>
    </div>
  </header>
  <div class="frame-wrap"><iframe id="aicFrame" src="../aic_calculator.html" title="LoadCalcPro X AIC Calculator"></iframe></div>
</div>
<script>
(function(){
  const frame=document.getElementById('aicFrame');
  function frameDoc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
  function frameWin(){try{return frame.contentWindow}catch(e){return null}}

  frame.addEventListener('load',function(){
    const d=frameDoc();
    if(!d) return;
    try{
      let style=d.getElementById('loadcalcproOuterHeaderHide');
      if(!style){
        style=d.createElement('style');
        style.id='loadcalcproOuterHeaderHide';
        style.textContent='@media screen{.form-titlebar{display:none!important}.page{margin-top:24px!important}}';
        d.head.appendChild(style);
      }
    }catch(e){console.error('AIC frame setup failed',e)}
  });

  document.getElementById('mainSiteBtn').addEventListener('click',function(){location.href='../index.html'});
  document.getElementById('calculatorsBtn').addEventListener('click',function(){location.href='../member-dashboard.html'});
  document.getElementById('printBtn').addEventListener('click',function(){
    const w=frameWin();
    if(w&&typeof w.preparePrint==='function') w.preparePrint();
  });
  document.getElementById('newCalculationBtn').addEventListener('click',function(){
    const d=frameDoc();
    if(!d) return;
    const innerNew=d.getElementById('newCalculationBtn');
    if(innerNew){innerNew.click();return;}
    const candidates=Array.from(d.querySelectorAll('button'));
    const button=candidates.find(function(b){return /new calculation/i.test((b.textContent||'').trim())});
    if(button) button.click();
  });
})();
</script>
</body>
</html>
