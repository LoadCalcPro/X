<style>
:root{--navy:#071b47;--teal:#0f766e;--teal2:#115e59}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.shell{height:100%;display:flex;flex-direction:column}.app-header{flex:0 0 auto;padding:16px 30px 18px;background:var(--navy);color:#fff;box-shadow:0 10px 24px rgba(15,23,42,.18)}.header-top{display:flex;align-items:flex-start;gap:28px;min-width:0}.brand{flex:0 0 auto;margin-top:2px;color:#fff;font-size:25px;line-height:1;font-weight:900;letter-spacing:-.02em;white-space:nowrap}.brand .bolt,.brand .x{color:#5eead4}.brand .bolt{margin-right:5px}.brand .x{margin-left:2px}.title-block{min-width:0}.title{margin:0;font-size:22px;line-height:1.15;font-weight:900;white-space:nowrap}.version{margin-top:5px;color:#dbeafe;font-size:12px;line-height:1.2;font-weight:700}.actions{display:flex;align-items:stretch;gap:10px;width:100%;margin-top:16px}.actions button,.print-control{min-width:0;min-height:44px;border:1px solid rgba(255,255,255,.42);border-radius:9px;background:rgba(255,255,255,.10);color:#fff;font-size:13px;line-height:1.15;font-weight:800}.actions button{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;cursor:pointer;white-space:nowrap}.actions button:hover{background:rgba(255,255,255,.18)}.actions .primary{background:var(--teal);border-color:#2dd4bf}.actions .primary:hover{background:var(--teal2)}.print-control{flex:0 1 250px;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 9px;white-space:nowrap}.print-control select{width:116px;min-height:31px;padding:4px 6px;border:1px solid rgba(255,255,255,.48);border-radius:7px;background:#fff;color:#111827;font-size:12px;font-weight:700}.frame-wrap{flex:1 1 auto;min-height:0;background:#f3f4f6}#aicFrame{display:block;width:100%;height:100%;border:0;background:#f3f4f6}.restore-overlay{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.72)}.restore-overlay.show{display:flex}.restore-box{width:min(560px,100%);background:#fff;border-radius:20px;padding:30px 32px 28px;box-shadow:0 28px 80px rgba(0,0,0,.34)}.restore-brand{font-size:26px;font-weight:900;color:#244396;margin-bottom:20px}.restore-title{margin:0 0 20px;color:#374151;font-size:21px;line-height:1.25}.restore-text{margin:0 0 26px;color:#4b5563;font-size:19px;line-height:1.5}.restore-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}.restore-actions button{min-height:78px;border-radius:14px;font-size:17px;font-weight:900;cursor:pointer}.restore-new{background:#fff;color:#244396;border:1.5px solid #244396}.restore-continue{background:#244396;color:#fff;border:1.5px solid #244396}@media(max-width:700px){.app-header{padding:14px 14px 16px}.header-top{display:block}.brand{font-size:20px}.title{margin-top:8px;font-size:18px;white-space:normal}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button,.print-control{min-height:46px}.print-control{grid-column:1/-1;width:100%;max-width:none}.restore-box{padding:24px 22px}.restore-actions{grid-template-columns:1fr}.restore-title{font-size:21px}.restore-text{font-size:17px}}@media(min-width:701px){.app-header{width:100%;max-width:1100px;margin:0 auto}.brand{display:inline-flex;align-items:center;font-size:0}.brand::before{content:"LoadCalc";order:1;color:#fff;font-size:27px;font-weight:900}.brand .bolt{order:0;font-size:27px;color:#fff;margin-right:4px}.brand .x{order:2;font-size:27px;color:#5eead4;margin-left:0;font-weight:900}.brand .x::before{content:"Pro "}.restore-box{width:100%;max-width:430px;border-radius:16px;padding:21px}.restore-brand{font-size:21px;margin-bottom:8px}.restore-title{margin:0 0 8px;font-size:21px}.restore-text{margin:8px 0 15px;font-size:16px;line-height:1.45}.restore-actions{gap:9px}.restore-actions button{min-height:43px;border-radius:9px;font-size:16px;font-weight:800}}
</style></head><body><div class="shell"><header class="app-header"><div class="header-top"><div class="brand"><span class="bolt">⚡</span>LoadCalcPro<span class="x"> X</span></div><div class="title-block"><div class="title">Available Fault Current (AIC)</div><div class="version">Version 1.0</div></div></div><div class="actions"><button type="button" id="mainSiteBtn">Main Site</button><button type="button" id="calculatorsBtn">Calculators</button><label class="print-control" for="outerPrintLayout">Print Options <select id="outerPrintLayout" aria-label="Print options"><option value="1">1 per page</option><option value="2">2 per page</option><option value="4" selected>4 per page</option><option value="8">8 per page</option></select></label><button type="button" class="primary" id="printBtn">Print / PDF</button><button type="button" id="newCalculationBtn">New Calculation</button></div></header><div class="frame-wrap"><iframe id="aicFrame" src="../aic_calculator.html" title="LoadCalcPro X AIC Calculator"></iframe></div></div>
<div class="restore-overlay" id="outerRestore" role="dialog" aria-modal="true" aria-labelledby="outerRestoreTitle"><div class="restore-box"><div class="restore-brand">LoadCalcPro X</div><h2 class="restore-title" id="outerRestoreTitle">A previous calculation was found.</h2><p class="restore-text">Would you like to continue your previous calculation or start a new one?</p><div class="restore-actions"><button type="button" class="restore-new" id="outerStartNew">Start New Calculation</button><button type="button" class="restore-continue" id="outerContinue">Continue Previous Calculation</button></div></div></div>
<script>(function(){const frame=document.getElementById('aicFrame'),outerLayout=document.getElementById('outerPrintLayout'),outerRestore=document.getElementById('outerRestore');function frameDoc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}function frameWin(){try{return frame.contentWindow}catch(e){return null}}function hasSavedAic(){try{const raw=localStorage.getItem('loadCalcProAicCalculatorExpandablePanels');if(!raw)return false;const saved=JSON.parse(raw);if(!saved||!saved.values||typeof saved.values!=='object')return false;return Object.entries(saved.values).some(function(entry){return entry[0]!=='utilityFault2'&&String(entry[1]||'').trim()!==''})}catch(e){return false}}frame.addEventListener('load',function(){const d=frameDoc();if(!d)return;try{let style=d.getElementById('loadcalcproOuterHeaderHide');if(!style){style=d.createElement('style');style.id='loadcalcproOuterHeaderHide';style.textContent='@media screen{.form-titlebar{display:none!important}.page{margin-top:24px!important}.restore-modal{display:none!important}}';d.head.appendChild(style)}const innerLayout=d.getElementById('printLayout');if(innerLayout)outerLayout.value=innerLayout.value||'4';if(hasSavedAic())outerRestore.classList.add('show')}catch(e){console.error('AIC frame setup failed',e)}});document.getElementById('outerContinue').addEventListener('click',function(){const w=frameWin();if(w&&typeof w.continuePreviousCalculation==='function')w.continuePreviousCalculation();outerRestore.classList.remove('show')});document.getElementById('outerStartNew').addEventListener('click',function(){const w=frameWin();if(w&&typeof w.startNewCalculation==='function')w.startNewCalculation();outerRestore.classList.remove('show')});document.getElementById('mainSiteBtn').addEventListener('click',function(){location.href='../index.html'});document.getElementById('calculatorsBtn').addEventListener('click',function(){location.href='../member-dashboard.html'});outerLayout.addEventListener('change',function(){const d=frameDoc(),inner=d&&d.getElementById('printLayout');if(inner){inner.value=outerLayout.value;inner.dispatchEvent(new Event('change',{bubbles:true}))}});document.getElementById('printBtn').addEventListener('click',function(){const w=frameWin();if(w&&typeof w.preparePrint==='function')w.preparePrint()});document.getElementById('newCalculationBtn').addEventListener('click',function(){const w=frameWin();if(w&&typeof w.startNewCalculation==='function'){w.startNewCalculation();return}const d=frameDoc();if(!d)return;const button=Array.from(d.querySelectorAll('button')).find(function(b){return /new calculation/i.test((b.textContent||'').trim())});if(button)button.click()})})();</script></body></html>
