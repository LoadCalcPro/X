name: Migrate Generator From Staging

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-generator-from-staging.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout X
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          repository: LoadCalcPro/electrical-load-calculator-staging
          ref: main
          path: staging-source

      - name: Copy current staging generator into X
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generator
          cp staging-source/generator/index.html generator/index.html
          cp staging-source/generator/script.js generator/script.js
          cp staging-source/generator/styles.css generator/styles.css
          cp staging-source/generator/mobile-managed-46.css generator/mobile-managed-46.css
          cp staging-source/generator/cooling-managed-fix.js generator/cooling-managed-fix.js
          cp staging-source/generator/heatpump-independent-answers-fix.js generator/heatpump-independent-answers-fix.js
          rm -rf staging-source

          sed -i "s#../staging-member-dashboard.html#../member-dashboard.html#g" generator/index.html

          if grep -RniE 'staging-member-dashboard|hcml-api-staging|staging\.onrender|electrical-load-calculator-staging' generator; then
            echo 'Staging-only reference remains in generator files.'
            exit 1
          fi

      - name: Point production dashboard to local Generator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('member-dashboard.html')
          text = p.read_text()
          old = 'https://loadcalcpro.github.io/electrical-load-calculator/generator/'
          if old not in text:
              raise SystemExit('Expected old Generator URL not found in member-dashboard.html')
          p.write_text(text.replace(old, 'generator/'))
          PY

      - name: Commit migrated Generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LoadCalcPro'
          git config user.email 'elecloadcalc@outlook.com'
          git add generator member-dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'Migrate current staging Generator into X production'
          git push
