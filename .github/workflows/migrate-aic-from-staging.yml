name: Migrate AIC From Staging

on:
  push:
    paths:
      - '.github/workflows/migrate-aic-from-staging.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout X
        uses: actions/checkout@v4
        with:
          path: x

      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          repository: LoadCalcPro/electrical-load-calculator-staging
          path: staging

      - name: Copy current staging AIC into X and convert staging references
        shell: python
        run: |
          from pathlib import Path
          src = Path('staging/aic_calculator.html')
          dst = Path('x/aic_calculator.html')
          text = src.read_text(encoding='utf-8')
          replacements = {
              'LoadCalcPro | AIC Calculator | Staging': 'LoadCalcPro X | AIC Calculator',
              'staging-member-dashboard.html': 'member-dashboard.html',
              'https://loadcalcpro-hcml-api-staging.onrender.com': 'https://loadcalcpro-hcml-api.onrender.com',
              'https://jvnkncpljuaeycwjyeai.supabase.co': 'https://oaqehddiqtgplxydxbxv.supabase.co',
              'sb_publishable_aMerqRsuagFjUU67WWmspA_2uDtn4CF': 'sb_publishable_o_3xMc9QOsgV-8kqBFkLnw_tuvUyWD8',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          dst.write_text(text, encoding='utf-8')

      - name: Point production dashboard to local AIC
        shell: python
        run: |
          from pathlib import Path
          p = Path('x/member-dashboard.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('https://loadcalcpro.github.io/electrical-load-calculator/aic_calculator.html', 'aic_calculator.html')
          p.write_text(text, encoding='utf-8')

      - name: Commit migrated AIC
        working-directory: x
        run: |
          git config user.name "LoadCalcPro"
          git config user.email "elecloadcalc@outlook.com"
          git add aic_calculator.html member-dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Migrate current staging AIC to X production"
            git push
          fi
