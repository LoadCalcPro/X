<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LoadCalcPro X | AIC Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
<header class="app-header">
  <div class="header-top">
    <div class="brand"><span class="bolt">⚡</span><span class="x">X</span></div>
    <div class="title-block"><div class="title">Available Fault Current (AIC)</div><div class="version">Version 1.0</div></div>
  </div>
  <div class="actions">
    <button type="button" id="mainSiteBtn">Main Site</button>
    <button type="button" id="calculatorsBtn">Calculators</button>
    <div class="print-control" aria-label="Print options">
      <select id="outerPrintType" aria-label="Print type">
        <option value="branded" selected>Branded Report</option>
        <option value="calculation">Calculation Only</option>
      </select>
      <select id="outerPrintLayout" aria-label="Print layout">
        <option value="full" selected>Full Page</option>
        <option value="side">Side by Side</option>
        <option value="stacked">Stacked</option>
        <option value="columns">Stacked Columns</option>
      </select>
    </div>
    <button type="button" class="primary" id="printBtn">Print / PDF</button>
    <button type="button" id="newCalculationBtn">New Calculation</button>
  </div>
</header>
<div class="frame-wrap"><iframe id="aicFrame" src="../aic_calculator.html" title="LoadCalcPro X AIC Calculator"></iframe></div>
</div>
<script src="app.js"></script>
<script src="motor-contribution.js"></script>
<script src="aic-display.js"></script>
<script src="drawing-output.js"></script>
</body>
</html>
