<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LoadCalcPro X | AIC Calculator</title>
<style>
:root{--navy:#071b47;--teal:#0f766e;--teal2:#115e59;--page:#f3f4f6}*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0;background:var(--page);font-family:Arial,Helvetica,sans-serif;color:#111827}body{overflow-x:hidden}.shell{min-height:100vh}.app-header{width:100%;max-width:1100px;margin:0 auto;padding:18px 24px 20px;background:var(--navy);color:#fff;box-shadow:0 10px 24px rgba(15,23,42,.18)}.header-top{display:flex;align-items:flex-start;gap:30px}.brand{display:inline-flex;align-items:center;flex:0 0 auto;margin-top:1px;font-size:0;line-height:1;font-weight:900;white-space:nowrap}.brand .bolt{order:0;margin-right:5px;color:#ff7a45;font-size:29px}.brand::before{content:"LoadCalc";order:1;color:#fff;font-size:29px;letter-spacing:-.025em}.brand .x{order:2;color:#5eead4;font-size:29px;letter-spacing:-.025em}.brand .x::before{content:"Pro "}.title-block{min-width:0}.title{margin:0;font-size:22px;line-height:1.15;font-weight:900;white-space:nowrap}.version{margin-top:6px;color:#dbeafe;font-size:12px;font-weight:700}.actions{display:grid;grid-template-columns:1fr 1fr 1.35fr 1fr 1fr;gap:10px;width:100%;margin-top:18px}.actions button,.print-control{min-width:0;min-height:46px;border:1px solid rgba(255,255,255,.40);border-radius:9px;background:rgba(255,255,255,.10);color:#fff;font-size:13px;font-weight:800}.actions button{display:flex;align-items:center;justify-content:center;padding:10px 14px;cursor:pointer}.actions button:hover{background:rgba(255,255,255,.18)}.actions .primary{background:var(--teal);border-color:#2dd4bf}.actions .primary:hover{background:var(--teal2)}.print-control{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 9px;white-space:nowrap}.print-control select{width:118px;min-height:32px;border:0;border-radius:7px;padding:5px 7px;background:#fff;color:#111827;font-size:12px;font-weight:700}.frame-wrap{width:100%;background:var(--page)}#aicFrame{display:block;width:100%;min-height:850px;border:0;background:var(--page)}@media(max-width:760px){.app-header{padding:15px 14px 17px}.header-top{display:block}.brand .bolt,.brand::before,.brand .x{font-size:23px}.title{margin-top:10px;font-size:18px;white-space:normal}.actions{grid-template-columns:1fr 1fr}.print-control{grid-column:1/-1}}
</style>
</head>
<body>
<div class="shell">
<header class="app-header">
  <div class="header-top">
    <div class="brand"><span class="bolt">⚡</span><span class="x">X</span></div>
    <div class="title-block"><div class="title">Available Fault Current (AIC)</div><div class="version">Version 1.0</div></div>
  </div>
  <div class="actions">
    <button type="button" id="mainSiteBtn">Main Site</button>
    <button type="button" id="calculatorsBtn">Calculators</button>
    <label class="print-control" for="outerPrintLayout">Print Options
      <select id="outerPrintLayout" aria-label="Print options">
        <option value="1">1 per page</option><option value="2">2 per page</option><option value="4" selected>4 per page</option><option value="8">8 per page</option>
      </select>
    </label>
    <button type="button" class="primary" id="printBtn">Print / PDF</button>
    <button type="button" id="newCalculationBtn">New Calculation</button>
  </div>
</header>
<div class="frame-wrap"><iframe id="aicFrame" src="../aic_calculator.html" title="LoadCalcPro X AIC Calculator"></iframe></div>
</div>
<script>
(function(){
  const frame=document.getElementById('aicFrame');
  const layout=document.getElementById('outerPrintLayout');
  const wireOrder=['8','6','4','3','2','1','1/0','2/0','3/0','4/0','250MCM','300MCM','350MCM','400MCM','500MCM','600MCM','750MCM','1000MCM'];
  let resizeObserver=null;
  function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
  function win(){try{return frame.contentWindow}catch(e){return null}}
  function positionRestoreModal(){
    const d=doc();if(!d)return;
    const modal=d.getElementById('restoreModal');if(!modal)return;
    const rect=frame.getBoundingClientRect();
    const visibleTop=Math.max(0,-rect.top);
    const visibleBottom=Math.min(frame.offsetHeight,window.innerHeight-rect.top);
    const visibleHeight=Math.max(0,visibleBottom-visibleTop);
    modal.style.top=visibleTop+'px';
    modal.style.height=(visibleHeight||window.innerHeight)+'px';
  }
  function prepareInnerPage(){
    const d=doc();
    if(!d)return;
    let s=d.getElementById('xUnifiedAicHeader');
    if(!s){s=d.createElement('style');s.id='xUnifiedAicHeader';d.head.appendChild(s)}
    s.textContent='@media screen{.form-titlebar,#accessGate{display:none!important}body.access-locked{overflow:auto!important}.page{margin-top:8px!important;margin-bottom:8px!important}.restore-modal{position:absolute!important;inset:auto 0 auto 0!important;z-index:100!important;align-items:center!important;justify-content:center!important;padding:20px!important;background:rgba(15,23,42,.6)!important;backdrop-filter:none!important}.restore-dialog{width:100%!important;max-width:430px!important;overflow:visible!important;border:1px solid #d1d5db!important;border-radius:16px!important;padding:21px!important;background:#fff!important;box-shadow:0 24px 80px rgba(0,0,0,.32)!important}.restore-dialog-header{padding:0!important;border:0!important}.restore-dialog-kicker{display:none!important}.restore-dialog h2{margin:0 0 8px!important;color:#1e3a8a!important;font-size:21px!important;line-height:1.2!important}.restore-dialog-body{padding:0!important;color:#374151!important;font-size:16px!important;line-height:1.45!important}.restore-dialog-body p{margin:8px 0 15px!important}.restore-dialog-actions{display:grid!important;grid-template-columns:1fr!important;gap:9px!important;padding:0!important}.restore-dialog-actions button{width:100%!important;min-height:43px!important;border:1px solid #1e3a8a!important;border-radius:9px!important;padding:9px 11px!important;background:#1e3a8a!important;color:#fff!important;font-size:13.3333px!important;font-weight:800!important}.restore-dialog-actions button.restore-secondary{background:#fff!important;color:#1e3a8a!important}@media(min-width:520px){.restore-dialog-actions{grid-template-columns:1fr 1fr!important}}}';
    if(d.body)d.body.classList.remove('access-locked');
    const title=d.getElementById('restoreModalTitle');
    if(title)title.textContent='LoadCalcPro';
    const body=d.querySelector('.restore-dialog-body');
    if(body)body.innerHTML='<p><strong>A previous calculation was found.</strong></p><p>Would you like to continue your previous calculation or start a new one?</p>';
    const actions=d.querySelector('.restore-dialog-actions');
    const start=d.getElementById('startNewBtn');
    const cont=d.getElementById('continuePreviousBtn');
    if(start){start.textContent='Start New Calculation';start.classList.add('restore-secondary')}
    if(actions&&start&&cont){actions.appendChild(start);actions.appendChild(cont)}
    reorderWireSizes();
    positionRestoreModal();
  }
  function reorderWireSizes(){
    const d=doc();if(!d)return;
    d.querySelectorAll('select').forEach(sel=>{
      const opts=Array.from(sel.options);
      if(!opts.some(o=>o.value==='1000MCM')||!opts.some(o=>o.value==='8'))return;
      const current=sel.value,placeholder=opts.find(o=>o.value===''),byValue=new Map(opts.map(o=>[o.value,o]));
      sel.innerHTML='';
      if(placeholder)sel.appendChild(placeholder);
      wireOrder.forEach(v=>{const o=byValue.get(v);if(o)sel.appendChild(o)});
      if(byValue.has(current))sel.value=current;
    });
  }
  function resizeFrame(){
    const d=doc();if(!d)return;
    requestAnimationFrame(()=>{
      const b=d.body,h=d.documentElement;
      const height=Math.max(b?b.scrollHeight:0,b?b.offsetHeight:0,h?h.scrollHeight:0,h?h.offsetHeight:0);
      if(height)frame.style.height=(height+4)+'px';
      positionRestoreModal();
    });
  }
  function syncLayout(){const d=doc();const inner=d&&d.getElementById('printLayout');if(inner)layout.value=inner.value||'4'}
  frame.addEventListener('load',function(){
    const d=doc();if(!d)return;
    prepareInnerPage();syncLayout();resizeFrame();
    setTimeout(()=>{prepareInnerPage();resizeFrame()},150);
    setTimeout(()=>{prepareInnerPage();resizeFrame()},600);
    if(window.ResizeObserver&&d.body){if(resizeObserver)resizeObserver.disconnect();resizeObserver=new ResizeObserver(resizeFrame);resizeObserver.observe(d.body)}
    d.addEventListener('click',function(){setTimeout(()=>{reorderWireSizes();resizeFrame()},50)},true);
  });
  window.addEventListener('resize',function(){resizeFrame();positionRestoreModal()});
  window.addEventListener('scroll',positionRestoreModal,{passive:true});
  document.getElementById('mainSiteBtn').addEventListener('click',()=>location.href='../index.html');
  document.getElementById('calculatorsBtn').addEventListener('click',()=>location.href='../member-dashboard.html');
  layout.addEventListener('change',function(){const d=doc(),inner=d&&d.getElementById('printLayout');if(inner){inner.value=layout.value;inner.dispatchEvent(new Event('change',{bubbles:true}))}});
  document.getElementById('printBtn').addEventListener('click',function(){const w=win();if(w&&typeof w.preparePrint==='function')w.preparePrint()});
  document.getElementById('newCalculationBtn').addEventListener('click',function(){const w=win();if(w&&typeof w.startNewCalculation==='function'){w.startNewCalculation();setTimeout(resizeFrame,50)}});
})();
</script>
</body>
</html>
